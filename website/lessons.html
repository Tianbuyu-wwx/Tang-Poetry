<style>
  .les-page { max-width: 1000px; margin: 0 auto; padding: 3rem 3rem 5rem; position: relative; z-index: 1; }
  .les-head { text-align: center; margin-bottom: 1.8rem; }
  .les-head h1 { font-family: "Ma Shan Zheng","STKaiti",serif; font-size: 56px; color: var(--ink-deep); letter-spacing: 8px; }
  .les-head .sub { font-family: "ZCOOL XiaoWei",serif; font-size: 14px; letter-spacing: 4px; color: var(--ink-light); margin-top: .6rem; }
  .les-intro {
    max-width: 760px; margin: 0 auto 2.6rem; padding: 1.4rem 1.6rem;
    border: 1px solid var(--rule); border-left: 3px solid var(--cinnabar);
    background: rgba(255,255,255,.45); font: 14px/2 "Noto Serif SC",serif; color: var(--ink); letter-spacing: 1px;
  }
  .les-list { display: grid; gap: 1.6rem; }
  .les-card {
    padding: 1.8rem 2rem; border: 1px solid var(--rule); background: rgba(255,255,255,.42);
    transition: border-color .2s, box-shadow .2s;
  }
  .les-card:hover { border-color: var(--cinnabar); box-shadow: 0 6px 20px rgba(122,40,40,.10); }
  .les-title-row { display: flex; align-items: baseline; flex-wrap: wrap; gap: .8rem; margin-bottom: .8rem; }
  .les-title { font-family: "ZCOOL XiaoWei","STKaiti",serif; font-size: 28px; letter-spacing: 4px; color: var(--ink-deep); }
  .les-status { font: 11px "Noto Serif SC",serif; letter-spacing: 1px; padding: .15rem .6rem; border-radius: 2px; border: 1px solid var(--rule); color: var(--ink-light); }
  .les-status.open { color: var(--cinnabar); border-color: var(--cinnabar); }
  .les-meta { display: flex; flex-wrap: wrap; gap: 1.2rem; font: 12px "Noto Serif SC",serif; color: var(--ink-light); letter-spacing: 1px; margin-bottom: 1rem; }
  .les-meta b { color: var(--ink); font-weight: 500; }
  .les-block { margin-bottom: .9rem; }
  .les-block .label { font: 12px "ZCOOL XiaoWei",serif; color: var(--cinnabar); letter-spacing: 2px; margin-bottom: .3rem; }
  .les-block .text { font: 13px/1.9 "Noto Serif SC",serif; color: var(--ink); letter-spacing: .5px; }
  .les-works { display: flex; flex-wrap: wrap; gap: .5rem; list-style: none; padding: 0; margin: .3rem 0 0; }
  .les-works a { display: inline-flex; align-items: baseline; gap: .4rem; text-decoration: none; padding: .35rem .8rem; border: 1px solid var(--rule); background: rgba(255,255,255,.5); color: var(--ink); transition: all .18s; }
  .les-works a:hover, .les-works a:focus-visible { border-color: var(--cinnabar); color: var(--cinnabar); outline: none; }
  .les-works .t { font: 14px "ZCOOL XiaoWei","STKaiti",serif; letter-spacing: 2px; }
  .les-works .g { font: 11px "Noto Serif SC",serif; color: var(--ink-light); }
  .les-works a:hover .g { color: var(--cinnabar); }
  .les-works .none { font: 12px "Noto Serif SC",serif; color: var(--ink-light); letter-spacing: 1px; }
  .les-empty { text-align: center; font-family: "Noto Serif SC",serif; color: var(--ink-light); padding: 3rem 0; }

  @media (max-width: 600px){
    .les-page { padding: 2rem 1.2rem 3rem; }
    .les-head h1 { font-size: 40px; letter-spacing: 5px; }
    .les-card { padding: 1.4rem 1.2rem; }
  }
</style>
