<style>
  .news-page { max-width: 860px; margin: 0 auto; padding: 3rem 3rem 5rem; position: relative; z-index: 1; }
  .news-head { text-align: center; margin-bottom: 2.2rem; }
  .news-head h1 { font-family: "Ma Shan Zheng","STKaiti",serif; font-size: 56px; color: var(--ink-deep); letter-spacing: 8px; }
  .news-head .sub { font-family: "ZCOOL XiaoWei",serif; font-size: 14px; letter-spacing: 4px; color: var(--ink-light); margin-top: .6rem; }

  .news-list { display: grid; gap: 1.8rem; }
  .news-card {
    padding: 1.8rem 2rem; border: 1px solid var(--rule); background: rgba(255,255,255,.42);
    border-left: 3px solid var(--cinnabar); transition: border-color .2s, box-shadow .2s;
  }
  .news-card:hover { box-shadow: 0 6px 20px rgba(122,40,40,.10); }
  .news-top { display: flex; align-items: center; flex-wrap: wrap; gap: .8rem; margin-bottom: .7rem; }
  .news-date { font: 12px "Noto Serif SC",serif; color: var(--ink-light); letter-spacing: 1px; }
  .news-tag { font: 11px "Noto Serif SC",serif; letter-spacing: 1px; padding: .12rem .6rem; border-radius: 2px; border: 1px solid var(--gold); color: var(--gold); }
  .news-title { font-family: "ZCOOL XiaoWei","STKaiti",serif; font-size: 26px; letter-spacing: 3px; color: var(--ink-deep); margin-bottom: .4rem; }
  .news-author { font: 12px "Noto Serif SC",serif; color: var(--ink-light); letter-spacing: 1px; margin-bottom: 1rem; }
  .news-body { font: 14px/2 "Noto Serif SC",serif; color: var(--ink); letter-spacing: .5px; }
  .news-body p { margin: 0 0 .9rem; }
  .news-body p:last-child { margin-bottom: 0; }
  .news-body h2 { font-family: "ZCOOL XiaoWei",serif; font-size: 18px; color: var(--ink-deep); letter-spacing: 2px; margin: 1.2rem 0 .6rem; }
  .news-body h3 { font-family: "ZCOOL XiaoWei",serif; font-size: 16px; color: var(--ink-deep); letter-spacing: 2px; margin: 1rem 0 .5rem; }
  .news-body ul, .news-body ol { padding-left: 1.6em; margin: 0 0 .9rem; }
  .news-body li { margin-bottom: .4rem; }
  .news-body a { color: var(--cinnabar); text-decoration: none; border-bottom: 1px solid rgba(168,50,50,.35); }
  .news-body a:hover { border-bottom-color: var(--cinnabar); }
  .news-body code { font-family: ui-monospace, "Cascadia Code", monospace; background: rgba(26,26,26,.06); padding: .05rem .35rem; border-radius: 3px; font-size: 13px; }
  .news-body hr { border: none; border-top: 1px solid var(--rule); margin: 1.2rem 0; }
  .news-body strong { color: var(--cinnabar-deep); }
  .news-empty { text-align: center; font-family: "Noto Serif SC",serif; color: var(--ink-light); padding: 3rem 0; }

  @media (max-width: 600px){
    .news-page { padding: 2rem 1.2rem 3rem; }
    .news-head h1 { font-size: 40px; letter-spacing: 5px; }
    .news-card { padding: 1.4rem 1.2rem; }
  }
</style>
