<style>
  .idx-page { max-width: 1180px; margin: 0 auto; padding: 3rem 3rem 5rem; position: relative; z-index: 1; }
  .idx-head { text-align: center; margin-bottom: 2.5rem; }
  .idx-head h1 { font-family: "Ma Shan Zheng","STKaiti",serif; font-size: 56px; color: var(--ink-deep); letter-spacing: 8px; }
  .idx-head .sub { font-family: "ZCOOL XiaoWei",serif; font-size: 14px; letter-spacing: 4px; color: var(--ink-light); margin-top: .6rem; }
  .idx-search { max-width: 560px; margin: 0 auto 1.5rem; }
  .idx-search input {
    width: 100%; padding: 1rem 1.4rem; font-family: "Noto Serif SC",serif; font-size: 16px;
    border: 1px solid var(--rule-strong); background: rgba(255,255,255,.6); color: var(--ink);
    letter-spacing: 2px; outline: none; transition: border-color .2s;
  }
  .idx-search input:focus { border-color: var(--cinnabar); }
  .idx-filters { margin-bottom: 1.25rem; }
  .idx-filter-label { font-family: "Noto Serif SC",serif; font-size: 12px; color: var(--ink-light); letter-spacing: 1px; margin-bottom: .5rem; }
  .idx-filter-row { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center; margin-bottom: 1rem; }
  .idx-filter-row button {
    padding: .4rem .85rem; border: 1px solid var(--rule); background: rgba(255,255,255,.45);
    color: var(--ink); font: 13px "Noto Serif SC",serif; cursor: pointer; letter-spacing: 1px;
    transition: all .15s; border-radius: 2px;
  }
  .idx-filter-row button:hover, .idx-filter-row button:focus-visible { border-color: var(--cinnabar); color: var(--cinnabar); outline: none; }
  .idx-filter-row button.active { background: var(--cinnabar); border-color: var(--cinnabar); color: var(--paper); }
  .idx-initials { gap: .35rem; }
  .idx-initials button { padding: .35rem .55rem; min-width: 30px; font-size: 12px; }
  .idx-summary { text-align: center; font-family: "Noto Serif SC",serif; font-size: 13px; color: var(--ink-light); margin-bottom: 2rem; letter-spacing: 1px; }
  .idx-summary .num { color: var(--cinnabar); font-weight: 700; font-size: 15px; }
  .idx-group { margin-bottom: 3rem; }
  .idx-group h2 { font-family: "ZCOOL XiaoWei","STKaiti",serif; font-size: 26px; color: var(--ink-deep); letter-spacing: 6px; margin-bottom: 1.4rem; padding-bottom: .6rem; border-bottom: 2px solid var(--cinnabar); display: inline-block; }
  .idx-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 1rem; }
  .idx-card { display: flex; align-items: center; gap: .9rem; padding: 1rem 1.1rem; border: 1px solid var(--rule); background: rgba(255,255,255,.4); text-decoration: none; color: var(--ink); transition: all .2s; }
  .idx-card:hover, .idx-card:focus-visible { border-color: var(--cinnabar); transform: translateY(-2px); box-shadow: 0 6px 18px rgba(122,40,40,.12); outline: none; }
  .idx-card .seal { width: 40px; height: 40px; background: var(--cinnabar); color: var(--paper); font-family: "Ma Shan Zheng",serif; font-size: 22px; display: grid; place-items: center; border-radius: 4px; flex-shrink: 0; }
  .idx-card mark { color: var(--cinnabar); background: rgba(168,50,50,.12); padding: 0 2px; font-weight: 700; }
  .idx-card .nm { font-family: "ZCOOL XiaoWei","STKaiti",serif; font-size: 19px; letter-spacing: 3px; line-height: 1.2; }
  .idx-card .n { font-family: "Noto Serif SC",serif; font-size: 11px; color: var(--ink-light); letter-spacing: 1px; }
  .idx-empty { text-align: center; font-family: "Noto Serif SC",serif; color: var(--ink-light); padding: 3rem 0; }
  .idx-actions { text-align: center; margin-top: 2rem; }
  .list-more { padding: .8rem 1.6rem; border: 1px solid var(--cinnabar); background: transparent; color: var(--cinnabar); cursor: pointer; font: 14px "Noto Serif SC",serif; letter-spacing: 2px; }
  .list-more:hover,.list-more:focus-visible { color: var(--paper); background: var(--cinnabar); }
  @media (max-width: 600px){ .idx-page{ padding: 2rem 1.2rem 3rem; } .idx-grid{ grid-template-columns: repeat(auto-fill,minmax(120px,1fr)); } }
</style>
</head>

<main class="idx-page">
  <div class="idx-head">
    <h1>诗人索引</h1>
    <div class="sub">COMPLETE TANG POETS · 一代风华</div>
  </div>
  <div class="idx-search">
    <label class="sr-only" for="searchInput">搜索诗人姓名</label>
    <input id="searchInput" type="text" placeholder="搜索诗人姓名…" autocomplete="off">
  </div>
  <div class="idx-filters">
    <div class="idx-filter-row" id="dynastyFilters" role="group" aria-label="按朝代筛选">
      <button type="button" data-dynasty="" class="active" aria-pressed="true">全部</button>
      <button type="button" data-dynasty="初唐" aria-pressed="false">初唐</button>
      <button type="button" data-dynasty="盛唐" aria-pressed="false">盛唐</button>
      <button type="button" data-dynasty="中唐" aria-pressed="false">中唐</button>
      <button type="button" data-dynasty="晚唐" aria-pressed="false">晚唐</button>
      <button type="button" data-dynasty="唐" aria-pressed="false">唐</button>
      <button type="button" data-dynasty="五代" aria-pressed="false">五代</button>
      <button type="button" data-dynasty="不详" aria-pressed="false">其他</button>
    </div>
    <div class="idx-filter-row idx-initials" id="initialFilters" role="group" aria-label="按拼音首字母筛选">
      <button type="button" data-initial="" class="active" aria-pressed="true">全部</button>
      <button type="button" data-initial="A" aria-pressed="false">A</button>
      <button type="button" data-initial="B" aria-pressed="false">B</button>
      <button type="button" data-initial="C" aria-pressed="false">C</button>
      <button type="button" data-initial="D" aria-pressed="false">D</button>
      <button type="button" data-initial="E" aria-pressed="false">E</button>
      <button type="button" data-initial="F" aria-pressed="false">F</button>
      <button type="button" data-initial="G" aria-pressed="false">G</button>
      <button type="button" data-initial="H" aria-pressed="false">H</button>
      <button type="button" data-initial="J" aria-pressed="false">J</button>
      <button type="button" data-initial="K" aria-pressed="false">K</button>
      <button type="button" data-initial="L" aria-pressed="false">L</button>
      <button type="button" data-initial="M" aria-pressed="false">M</button>
      <button type="button" data-initial="N" aria-pressed="false">N</button>
      <button type="button" data-initial="O" aria-pressed="false">O</button>
      <button type="button" data-initial="P" aria-pressed="false">P</button>
      <button type="button" data-initial="Q" aria-pressed="false">Q</button>
      <button type="button" data-initial="R" aria-pressed="false">R</button>
      <button type="button" data-initial="S" aria-pressed="false">S</button>
      <button type="button" data-initial="T" aria-pressed="false">T</button>
      <button type="button" data-initial="W" aria-pressed="false">W</button>
      <button type="button" data-initial="X" aria-pressed="false">X</button>
      <button type="button" data-initial="Y" aria-pressed="false">Y</button>
      <button type="button" data-initial="Z" aria-pressed="false">Z</button>
    </div>
  </div>
  <div class="idx-summary" id="summary" aria-live="polite"></div>
  <div id="idxBody"></div>
  <div class="idx-empty" id="emptyHint" style="display:none">未找到匹配的诗人。</div>
  <div class="idx-actions"><button class="list-more" id="poetsMore" type="button" hidden>显示更多诗人</button></div>
</main>
